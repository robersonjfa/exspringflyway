<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f3864"/>
    </marker>
    <marker id="setaVermelha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="1600" height="1060" fill="#ffffff"/>
  <text x="80" y="70" font-size="36" font-weight="bold" fill="#1f3864">Como a aplicação está organizada</text>
  <text x="80" y="106" font-size="19" fill="#5a6478">Loja — Spring Data JPA (ORM) + Flyway (versionamento de schema) + PostgreSQL</text>

  <!-- NAVEGADOR -->
  <rect x="80" y="140" width="1440" height="96" rx="12" fill="#eef3fb" stroke="#1f3864" stroke-width="2"/>
  <text x="104" y="170" font-size="15" font-weight="bold" fill="#1f3864" letter-spacing="1.5">NAVEGADOR</text>
  <text x="104" y="202" font-size="19" fill="#1f2430">index.html  ·  style.css  ·  app.js — tela simples que chama a API com fetch</text>
  <text x="1080" y="202" font-size="16" fill="#5a6478">http://localhost:8080</text>

  <line x1="800" y1="236" x2="800" y2="286" stroke="#1f3864" stroke-width="2.5" marker-end="url(#seta)"/>
  <text x="816" y="268" font-size="16" fill="#1f3864">HTTP + JSON</text>

  <!-- SPRING BOOT -->
  <rect x="80" y="290" width="1440" height="300" rx="14" fill="#f7f9fc" stroke="#1f3864" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="104" y="322" font-size="15" font-weight="bold" fill="#1f3864" letter-spacing="1.5">APLICAÇÃO SPRING BOOT — porta 8080</text>

  <rect x="120" y="350" width="380" height="100" rx="10" fill="#ffffff" stroke="#2f5597" stroke-width="2"/>
  <text x="146" y="382" font-size="18" font-weight="bold" fill="#1f3864">Controller</text>
  <text x="146" y="410" font-size="15" fill="#1f2430">ClienteController · ProdutoController</text>
  <text x="146" y="432" font-size="15" fill="#1f2430">PedidoController — /api/...</text>

  <rect x="560" y="350" width="380" height="100" rx="10" fill="#ffffff" stroke="#2f5597" stroke-width="2"/>
  <text x="586" y="382" font-size="18" font-weight="bold" fill="#1f3864">Service</text>
  <text x="586" y="410" font-size="15" fill="#1f2430">regras de negócio · @Transactional</text>
  <text x="586" y="432" font-size="15" fill="#1f2430">ex.: baixar estoque ao criar pedido</text>

  <rect x="1000" y="350" width="380" height="100" rx="10" fill="#ffffff" stroke="#2f5597" stroke-width="2"/>
  <text x="1026" y="382" font-size="18" font-weight="bold" fill="#1f3864">Repository (Spring Data)</text>
  <text x="1026" y="410" font-size="15" fill="#1f2430">interfaces — sem SQL escrito à mão</text>
  <text x="1026" y="432" font-size="15" fill="#1f2430">findAllByOrderByNomeAsc() · @Query</text>

  <line x1="500" y1="400" x2="556" y2="400" stroke="#1f3864" stroke-width="2.5" marker-end="url(#seta)"/>
  <line x1="940" y1="400" x2="996" y2="400" stroke="#1f3864" stroke-width="2.5" marker-end="url(#seta)"/>

  <rect x="120" y="482" width="1260" height="86" rx="10" fill="#eef3fb" stroke="#2f5597" stroke-width="1.5"/>
  <text x="146" y="512" font-size="17" font-weight="bold" fill="#1f3864">Hibernate / JPA</text>
  <text x="146" y="540" font-size="15" fill="#1f2430">converte objeto em SQL · <tspan font-weight="bold">ddl-auto: validate</tspan> — só confere se a entidade bate com o banco; não cria nem altera tabela</text>

  <line x1="800" y1="590" x2="800" y2="638" stroke="#1f3864" stroke-width="2.5" marker-end="url(#seta)"/>
  <text x="816" y="620" font-size="16" fill="#1f3864">JDBC</text>

  <!-- POSTGRESQL -->
  <rect x="80" y="642" width="1000" height="290" rx="14" fill="#eef3fb" stroke="#1f3864" stroke-width="2"/>
  <text x="104" y="674" font-size="15" font-weight="bold" fill="#1f3864" letter-spacing="1.5">POSTGRESQL — porta 5432 · base "loja"</text>

  <rect x="120" y="700" width="280" height="80" rx="8" fill="#ffffff" stroke="#2f5597" stroke-width="2"/>
  <text x="140" y="732" font-size="17" font-weight="bold" fill="#1f3864">cliente</text>
  <text x="140" y="758" font-size="13" fill="#5a6478">id · nome · email · ativo · criado_em</text>

  <rect x="420" y="700" width="280" height="80" rx="8" fill="#ffffff" stroke="#2f5597" stroke-width="2"/>
  <text x="440" y="732" font-size="17" font-weight="bold" fill="#1f3864">produto</text>
  <text x="440" y="758" font-size="13" fill="#5a6478">id · nome · preco · estoque</text>

  <rect x="690" y="700" width="370" height="80" rx="8" fill="#ffffff" stroke="#2f5597" stroke-width="2"/>
  <text x="710" y="732" font-size="17" font-weight="bold" fill="#1f3864">pedido</text>
  <text x="710" y="758" font-size="12" fill="#5a6478">id · cliente_id · produto_id · qtd · observacao</text>

  <rect x="120" y="812" width="920" height="86" rx="8" fill="#fff8e6" stroke="#b45309" stroke-width="2"/>
  <text x="140" y="844" font-size="17" font-weight="bold" fill="#b45309">flyway_schema_history</text>
  <text x="140" y="874" font-size="14" fill="#1f2430">versão · descrição · quando rodou · sucesso — é o "diário" de tudo que já foi aplicado no banco</text>

  <!-- FLYWAY -->
  <rect x="1116" y="642" width="404" height="290" rx="14" fill="#fff8e6" stroke="#b45309" stroke-width="2"/>
  <text x="1140" y="674" font-size="15" font-weight="bold" fill="#b45309" letter-spacing="1.5">FLYWAY — na inicialização</text>
  <text x="1140" y="706" font-size="15" fill="#1f2430">lê src/main/resources/db/migration</text>
  <text x="1140" y="730" font-size="15" fill="#1f2430">V1__criar_tabelas.sql</text>
  <text x="1140" y="752" font-size="15" fill="#1f2430">V2__dados_iniciais.sql</text>
  <text x="1140" y="774" font-size="15" fill="#1f2430">V3__cliente_ativo.sql</text>
  <text x="1140" y="796" font-size="15" fill="#1f2430">V4__pedido_observacao.sql</text>
  <text x="1140" y="828" font-size="14" fill="#b45309" font-weight="bold">aplica só o que ainda não rodou,</text>
  <text x="1140" y="850" font-size="14" fill="#b45309" font-weight="bold">em ordem, e registra no histórico</text>
  <text x="1140" y="884" font-size="13" fill="#5a6478">migration nova = arquivo novo (V5, V6...)</text>

  <line x1="1112" y1="786" x2="1060" y2="786" stroke="#b45309" stroke-width="3" marker-end="url(#setaVermelha)"/>
  <text x="80" y="990" font-size="16" fill="#1f3864" font-weight="bold">Na subida: Flyway ajusta o schema → Hibernate valida as entidades → a aplicação começa a atender.</text>
  <text x="80" y="1020" font-size="15" fill="#5a6478">Se faltar uma coluna no banco, o validate derruba a aplicação — é o que impede o schema de ficar "na mão".</text>
</svg>
