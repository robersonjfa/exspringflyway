spring:
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/${DB_NAME:loja}
    username: ${DB_USER:aluno}
    password: ${DB_PASSWORD:aluno123}
  jpa:
    hibernate:
      # validacao: o Hibernate NAO cria nem altera tabela. Quem manda no schema e o Flyway.
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
