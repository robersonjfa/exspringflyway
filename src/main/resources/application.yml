spring:
  datasource:
    # PostgreSQL instalado na maquina local (porta padrao 5432).
    # Se o seu banco estiver em outro host/porta, use as variaveis DB_HOST, DB_PORT, DB_NAME, DB_USER e DB_PASSWORD.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:loja}
    username: ${DB_USER:aluno}
    password: ${DB_PASSWORD:aluno123}
  jpa:
    hibernate:
      # validacao: o Hibernate NAO cria nem altera tabela. Quem manda no schema e o Flyway.
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
