# OPCIONAL: use apenas se quiser o banco em container.
# Se o PostgreSQL ja esta instalado na maquina, ignore este arquivo (o projeto usa a 5432 local).

services:
  db:
    image: postgres:18
    container_name: loja_flyway
    environment:
      POSTGRES_USER: aluno
      POSTGRES_PASSWORD: aluno123
      POSTGRES_DB: loja
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
